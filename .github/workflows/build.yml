name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack mod.zip
        run: |
          set -e
          ZIP=$(ls -1 *.zip | head -n 1)
          echo "Using archive: $ZIP"
          mkdir -p unpacked
          unzip -q -o "$ZIP" -d unpacked
          GRADLE_FILE=$(find unpacked -maxdepth 3 -name build.gradle | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "build.gradle not found inside the zip" >&2
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Project dir: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Set project version to 1.0.1
        run: |
          set -euo pipefail
          mapfile -t files < <(grep -RIl --include='*.gradle' --include='*.gradle.kts' --include='gradle.properties' --include='*.toml' '1.0.0' "$PROJECT_DIR" || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::Could not find version 1.0.0 in Gradle project files"
            exit 1
          fi
          for file in "${files[@]}"; do
            sed -i 's/1\.0\.0/1.0.1/g' "$file"
          done
          grep -RIn --include='*.gradle' --include='*.gradle.kts' --include='gradle.properties' --include='*.toml' '1.0.1' "$PROJECT_DIR"

      - name: Build jar
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: FloatUI-1.0.1
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
