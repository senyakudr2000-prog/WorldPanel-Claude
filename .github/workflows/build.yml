name: Build Floating Inventory

on:
  push:
    paths:
      - 'mod.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack the exact mod archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP="mod.zip"
          test -f "$ZIP" || { echo "Archive not found: $ZIP" >&2; exit 1; }
          mkdir -p unpacked
          unzip -q -o "$ZIP" -d unpacked
          COMMON="$(find unpacked -type d -name common -print -quit)"
          if [[ -z "$COMMON" ]]; then
            echo "common/ folder not found inside $ZIP" >&2
            exit 1
          fi
          ROOT="$(dirname "$COMMON")"
          for module in neoforge fabric; do
            test -d "$ROOT/$module" || {
              echo "Missing module directory: $ROOT/$module" >&2
              exit 1
            }
          done
          echo "ROOT_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build NeoForge 1.21.1
        id: neoforge
        continue-on-error: true
        working-directory: ${{ env.ROOT_DIR }}/neoforge
        run: gradle build --no-daemon --stacktrace

      # Apply only to the extracted working copy; the committed archive stays unchanged.
      - name: Apply Fabric GUI mappings compatibility
        working-directory: ${{ env.ROOT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("common/src/main/java/dev/floatui/FloatPanel.java")
          if not path.is_file():
              raise SystemExit(f"Expected shared source not found: {path}")

          source = path.read_text(encoding="utf-8")
          replacements = {
              "getGuiLeft()": "leftPos",
              "getGuiTop()": "topPos",
              "getXSize()": "imageWidth",
              "getYSize()": "imageHeight",
          }
          for old, new in replacements.items():
              source = source.replace(old, new)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Build Fabric 1.21.1
        id: fabric
        continue-on-error: true
        working-directory: ${{ env.ROOT_DIR }}/fabric
        run: gradle build --no-daemon --stacktrace

      - name: Upload NeoForge jar
        if: steps.neoforge.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: floating-inventory-neoforge-1.21.1
          path: ${{ env.ROOT_DIR }}/neoforge/build/libs/floatui-neoforge-*.jar
          if-no-files-found: error

      - name: Upload Fabric jar
        if: steps.fabric.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: floating-inventory-fabric-1.21.1
          path: |
            ${{ env.ROOT_DIR }}/fabric/build/libs/floatui-fabric-*.jar
            !${{ env.ROOT_DIR }}/fabric/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Fail if either loader build failed
        if: steps.neoforge.outcome != 'success' || steps.fabric.outcome != 'success'
        shell: bash
        run: |
          echo "NeoForge: ${{ steps.neoforge.outcome }}" >&2
          echo "Fabric: ${{ steps.fabric.outcome }}" >&2
          exit 1
