
name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack mod.zip
        run: |
          set -e
          ZIP=$(ls -1 *.zip | head -n 1)
          echo "Using archive: $ZIP"
          mkdir -p unpacked
          unzip -q -o "$ZIP" -d unpacked
          COMMON=$(find unpacked -maxdepth 3 -type d -name common | head -n 1)
          if [ -z "$COMMON" ]; then
            echo "common/ folder not found inside the zip" >&2
            exit 1
          fi
          ROOT=$(dirname "$COMMON")
          echo "Project root: $ROOT"
          echo "ROOT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build NeoForge 1.21.1
        id: neoforge
        continue-on-error: true
        working-directory: ${{ env.ROOT_DIR }}/neoforge
        run: gradle build --no-daemon --stacktrace

      - name: Apply Fabric Mojang mappings compatibility
        working-directory: ${{ env.ROOT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("common/src/main/java/dev/floatui/FloatPanel.java")
          s = p.read_text()
          replacements = {
              "getGuiLeft()": "leftPos",
              "getGuiTop()": "topPos",
              "getXSize()": "imageWidth",
              "getYSize()": "imageHeight",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Build Fabric 1.21.1
        id: fabric
        continue-on-error: true
        working-directory: ${{ env.ROOT_DIR }}/fabric
        run: gradle build --no-daemon --stacktrace

      - name: Upload NeoForge jar
        if: steps.neoforge.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: floatui-neoforge-1.0.2
          path: ${{ env.ROOT_DIR }}/neoforge/build/libs/floatui-neoforge-*.jar
          if-no-files-found: error

      - name: Upload Fabric jar
        if: steps.fabric.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: floatui-fabric-1.0.2
          path: |
            ${{ env.ROOT_DIR }}/fabric/build/libs/floatui-fabric-*.jar
            !${{ env.ROOT_DIR }}/fabric/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Fail if any build failed
        if: steps.neoforge.outcome != 'success' || steps.fabric.outcome != 'success'
        run: |
          echo "NeoForge: ${{ steps.neoforge.outcome }}, Fabric: ${{ steps.fabric.outcome }}" >&2
          exit 1
          
