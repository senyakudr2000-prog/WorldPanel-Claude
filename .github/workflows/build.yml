name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack mod.zip
        run: |
          set -e
          ZIP=$(ls -1 *.zip | head -n 1)
          echo "Using archive: $ZIP"
          mkdir -p unpacked
          unzip -q -o "$ZIP" -d unpacked
          COMMON=$(find unpacked -maxdepth 3 -type d -name common | head -n 1)
          if [ -z "$COMMON" ]; then
            echo "common/ folder not found inside the zip" >&2
            exit 1
          fi
          ROOT=$(dirname "$COMMON")
          echo "Project root: $ROOT"
          echo "ROOT_DIR=$ROOT" >> "$GITHUB_ENV"


      - name: Patch source to 1.1.0 and fix Fabric 1.21.11 APIs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("unpacked") / "floatui"
          for path in root.rglob("gradle.properties"):
              text = path.read_text()
              text = __import__("re").sub(r"(?m)^mod_version=.*$", "mod_version=1.1.0", text)
              path.write_text(text)
          toml = root / "neoforge/src/main/resources/META-INF/neoforge.mods.toml"
          if toml.exists():
              toml.write_text(toml.read_text().replace('version="1.1.0"', 'version="1.1.0"'))
          readme = root / "README.md"
          if readme.exists():
              readme.write_text(readme.read_text().replace("-1.1.0.jar", "-1.1.0.jar"))
          fabric = root / "fabric-1.21.11/src/main/java/dev/floatui/fabric/FloatUIFabric.java"
          if fabric.exists():
              s = fabric.read_text()
              s = s.replace("net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper", "net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper")
              s = s.replace("KeyMappingHelper.registerKeyMapping(", "KeyBindingHelper.registerKeyBinding(")
              fabric.write_text(s)
          panel = root / "fabric-1.21.11/src/main/java/dev/floatui/FloatPanel.java"
          if panel.exists():
              panel.write_text(panel.read_text().replace("s.resize(mc, gw, gh)", "s.resize(gw, gh)"))
          # Keep the Fabric entrypoint outside the Mixin package namespace
          entry = root / "fabric-1.21.11/src/main/java/dev/floatui/fabric/FloatUIFabric.java"
          if entry.exists():
              s = entry.read_text().replace("package dev.floatui.fabric;", "package dev.floatuibootstrap;", 1)
              entry.write_text(s)
          metadata = root / "fabric-1.21.11/src/main/resources/fabric.mod.json"
          if metadata.exists():
              s = metadata.read_text().replace("dev.floatui.fabric.FloatUIFabric", "dev.floatuibootstrap.FloatUIFabric")
              metadata.write_text(s)
          # Split mixins by their actual Java package. The source uses both
          # dev.floatui.mixin and dev.floatui.fabric.mixin; a broad parent
          # package would also reserve normal classes such as FloatConfig.
          import json, re
          for cfg in list(root.rglob("*.mixins.json")):
              data = json.loads(cfg.read_text())
              if data.get("package") != "dev.floatui":
                  continue
              groups = {}
              for section in ("mixins", "client", "server"):
                  for entry_name in data.get(section, []):
                      simple = entry_name.split(".")[-1].split("$")[0]
                      matches = []
                      for java in root.rglob(simple + ".java"):
                          source = java.read_text()
                          if "@Mixin" not in source:
                              continue
                          match = re.search(r"(?m)^\s*package\s+([\w.]+)\s*;", source)
                          if match:
                              matches.append((match.group(1), java))
                      if not matches:
                          raise RuntimeError(f"Cannot locate Mixin source for {entry_name} in {cfg}")
                      packages = {item[0] for item in matches}
                      if len(packages) != 1:
                          raise RuntimeError(f"Ambiguous Mixin source for {entry_name}: {sorted(packages)}")
                      package = packages.pop()
                      groups.setdefault(package, {k: [] for k in ("mixins", "client", "server")})[section].append(entry_name)
              if not groups:
                  raise RuntimeError(f"No Mixin classes found in {cfg}")
              metadata = root / "fabric-1.21.11/src/main/resources/fabric.mod.json"
              meta = json.loads(metadata.read_text())
              mixin_configs = meta.get("mixins", [])
              if isinstance(mixin_configs, str):
                  mixin_configs = [mixin_configs]
              if cfg.name not in mixin_configs:
                  mixin_configs.append(cfg.name)
              new_configs = []
              for index, (package, sections) in enumerate(sorted(groups.items())):
                  new_name = cfg.name if index == 0 else cfg.stem + "." + package.rsplit(".", 1)[-1] + ".json"
                  new_data = dict(data)
                  new_data["package"] = package
                  for section in ("mixins", "client", "server"):
                      if section in data or sections[section]:
                          new_data[section] = sections[section]
                  (cfg.parent / new_name).write_text(json.dumps(new_data, indent=2) + "\n")
                  new_configs.append(new_name)
              mixin_configs = [name for name in mixin_configs if name != cfg.name] + new_configs
              meta["mixins"] = mixin_configs
              metadata.write_text(json.dumps(meta, indent=2) + "\n")
              cfg.unlink()
          PY
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build NeoForge 1.21.1
        id: neoforge
        continue-on-error: true
        working-directory: ${{ env.ROOT_DIR }}/neoforge
        run: gradle build --no-daemon --stacktrace

      - name: Build Fabric 1.21.1
        id: fabric
        continue-on-error: true
        working-directory: ${{ env.ROOT_DIR }}/fabric
        run: gradle build --no-daemon --stacktrace

      - name: Set up Gradle 9 (for 1.21.11)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build Fabric 1.21.11
        id: fabric1211
        continue-on-error: true
        working-directory: ${{ env.ROOT_DIR }}/fabric-1.21.11
        run: gradle build --no-daemon --stacktrace

      - name: Upload NeoForge jar
        if: steps.neoforge.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: floatui-neoforge-1.1.0-mc1.21.1
          path: ${{ env.ROOT_DIR }}/neoforge/build/libs/floatui-neoforge-*.jar
          if-no-files-found: error

      - name: Upload Fabric jar
        if: steps.fabric.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: floatui-fabric-1.1.0-mc1.21.1
          path: |
            ${{ env.ROOT_DIR }}/fabric/build/libs/floatui-fabric-*.jar
            !${{ env.ROOT_DIR }}/fabric/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload Fabric 1.21.11 jar
        if: steps.fabric1211.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: floatui-fabric-1.1.0-mc1.21.11
          path: |
            ${{ env.ROOT_DIR }}/fabric-1.21.11/build/libs/floatui-fabric-*.jar
            !${{ env.ROOT_DIR }}/fabric-1.21.11/build/libs/*-sources.jar
          if-no-files-found: error


      - name: Package patched source
        if: always()
        run: |
          cd unpacked
          zip -qr ../FloatUI-1.1.0-source.zip floatui

      - name: Upload patched source ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floatui-source-1.1.0
          path: FloatUI-1.1.0-source.zip
          if-no-files-found: error

      - name: Fail if any build failed
        if: steps.neoforge.outcome != 'success' || steps.fabric.outcome != 'success' || steps.fabric1211.outcome != 'success'
        run: |
          echo "NeoForge: ${{ steps.neoforge.outcome }}, Fabric 1.21.1: ${{ steps.fabric.outcome }}, Fabric 1.21.11: ${{ steps.fabric1211.outcome }}" >&2
          exit 1
