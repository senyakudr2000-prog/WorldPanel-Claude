name: Probe 1.21.11 sources

# Manual run only: Actions -> "Probe 1.21.11 sources" -> Run workflow.
# Decompiles Minecraft 1.21.11 (Mojang names) and uploads the rendering/GUI/input classes as an artifact.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Create probe project
        run: |
          mkdir -p probe && cd probe
          cat > settings.gradle <<'EOT'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'probe'
          EOT
          cat > build.gradle <<'EOT'
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
          }
          dependencies {
              minecraft "com.mojang:minecraft:1.21.11"
              mappings loom.officialMojangMappings()
              modImplementation "net.fabricmc:fabric-loader:0.18.1"
              modImplementation "net.fabricmc.fabric-api:fabric-api:0.140.2+1.21.11"
          }
          EOT

      - name: Decompile Minecraft
        working-directory: probe
        run: gradle genSources --no-daemon --stacktrace

      - name: Collect the needed sources
        run: |
          set -x
          mkdir -p out src
          find / -name '*-sources.jar' 2>/dev/null | grep -i -E 'minecraft|fabric-rendering|fabric-api-base|fabric-key|fabric-lifecycle|fabric-screen' > jars.txt || true
          cat jars.txt
          while read -r J; do
            D="src/$(basename "$J" .jar)"
            mkdir -p "$D"
            unzip -q -o "$J" \
              'net/minecraft/client/Minecraft.java' \
              'net/minecraft/client/MouseHandler.java' \
              'net/minecraft/client/KeyboardHandler.java' \
              'net/minecraft/client/KeyMapping.java' \
              'net/minecraft/client/gui/GuiGraphics.java' \
              'net/minecraft/client/gui/render/*' \
              'net/minecraft/client/gui/render/state/*' \
              'net/minecraft/client/gui/screens/Screen.java' \
              'net/minecraft/client/gui/screens/inventory/AbstractContainerScreen.java' \
              'net/minecraft/client/gui/screens/PauseScreen.java' \
              'net/minecraft/client/renderer/GameRenderer.java' \
              'net/minecraft/client/renderer/LevelRenderer.java' \
              'net/minecraft/client/renderer/RenderPipelines.java' \
              'net/minecraft/client/renderer/MultiBufferSource.java' \
              'net/minecraft/client/renderer/rendertype/*' \
              'net/minecraft/client/Camera.java' \
              'net/minecraft/client/DeltaTracker.java' \
              'net/minecraft/client/input/*' \
              'com/mojang/blaze3d/*' \
              'com/mojang/blaze3d/pipeline/*' \
              'com/mojang/blaze3d/systems/*' \
              'com/mojang/blaze3d/textures/*' \
              'com/mojang/blaze3d/buffers/*' \
              'com/mojang/blaze3d/vertex/*' \
              'net/fabricmc/fabric/api/client/rendering/v1/*' \
              'net/fabricmc/fabric/api/client/rendering/v1/level/*' \
              'net/fabricmc/fabric/api/client/keymapping/v1/*' \
              -d "$D" || true
          done < jars.txt
          find src -name '*.java' | sed 's#^src/##' | sort > out/file-list.txt
          cp jars.txt out/
          cd src && zip -qr ../out/mc-1.21.11-sources.zip . && cd ..
          ls -la out

      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: mc-1.21.11-sources
          path: out/*
          if-no-files-found: error
