name: Probe 26.2 sources

# Manual run only: Actions -> "Probe 26.2 sources" -> Run workflow.
# Decompiles Minecraft 26.2 and uploads the client / rendering / input classes as an artifact.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Create probe project
        run: |
          mkdir -p probe && cd probe
          cat > settings.gradle <<'EOT'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'probe'
          EOT
          cat > build.gradle <<'EOT'
          plugins {
              id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
          }
          dependencies {
              minecraft "com.mojang:minecraft:26.2"
              implementation "net.fabricmc:fabric-loader:0.19.3"
          }
          EOT

      - name: Decompile Minecraft
        working-directory: probe
        run: gradle genSources --no-daemon --stacktrace

      - name: Collect the needed sources
        run: |
          set -x
          mkdir -p out src
          find / -name '*-sources.jar' 2>/dev/null | grep -i minecraft > jars.txt || true
          cat jars.txt
          while read -r J; do
            D="src/$(basename "$J" .jar)"
            mkdir -p "$D"
            unzip -q -o "$J" \
              'net/minecraft/client/*.java' \
              'net/minecraft/client/gui/*' \
              'net/minecraft/client/input/*' \
              'net/minecraft/client/renderer/*.java' \
              'net/minecraft/client/renderer/rendertype/*' \
              'net/minecraft/client/renderer/state/*' \
              'net/minecraft/client/renderer/fog/*' \
              'net/minecraft/client/player/LocalPlayer.java' \
              'net/minecraft/resources/Identifier.java' \
              'com/mojang/blaze3d/*' \
              -d "$D" || true
          done < jars.txt
          find src -name '*.java' | sed 's#^src/##' | sort > out/file-list.txt
          cp jars.txt out/
          cd src && zip -qr ../out/mc-26.2-sources.zip . && cd ..
          ls -la out

      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: mc-26.2-sources
          path: out/*
          if-no-files-found: error
